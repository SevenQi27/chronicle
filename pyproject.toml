[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle-memory"
version = "0.3.0"
description = "Neo4j-backed episodic memory, evidence-linked understanding, and temporal recall for agents."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.11,<3",
  "mcp==2.3.0",
  "neo4j>=5.26,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
chronicle = "chronicle_memory.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
