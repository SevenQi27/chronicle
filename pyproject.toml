[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle-memory"
version = "0.3.0"
description = "Local SQLite memory for agents with evidence and revision history."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
chronicle = "chronicle_memory.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
